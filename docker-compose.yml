version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: trade_execution_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: trade_simulator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_simulator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: trade_execution_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/trade_simulator
      - SCENARIOS_DIR=./scenarios
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
